<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/js/tabjson.js" defer></script>
    <link rel="stylesheet" href="assets/css/tabjson.css">
    <title>Manipulation données JSON</title>
</head>
<body>

    <header><h1>Jeu de cartes</h1></header>
    <main>
        <table id="cards">
            <thead>
                <th>id</th>
                <th>name</th>
                <th>level</th>
                <th>description</th>
                <th>power</th>
                <th>attack</th>
                <th>armor</th>
                <th>damage</th>
                <th>mitigation</th>
                <th>played</th>
                <th>victory</th>
                <th>defeat</th>
                <th>draw</th>
            </thead>
            <tbody id="cards-tbody">
                
            </tbody>

        </table>
        <br>
        <label>Pick a </label>
        <input id="stat">
        <br>

        <div id="highest-attack-card">
            <span id="id-paragraph"></span>
            <span id="name-paragraph"></span>
            <span id="played-paragraph"></span>
            <span id="victory-paragraph"></span>
            <span id="highest-attack-card-paragraph"></span>
            <span id="power-paragraph"></span>
            <span id="armor-paragraph"></span>
        </div>
        <div id="highest-armour-card"></div>
        <div id="most-played-card"></div>
        <div id="most-victories-card"></div> 

    </main>
    <footer>
        
    </footer>
